name: Staging source integrity (NOT backend acceptance)
on:
  push:
    branches:
      - staging/academy-free-hosting-v16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-install-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned staging packages
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Parse all JavaScript modules
        run: |
          set -e
          find api lib pages netlify/functions public/assets scripts server.mjs -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
      - name: Import real staging gateway and check unconfigured DB rejects requests
        run: |
          node --input-type=module -e "
          const mod = await import('./netlify/functions/academy.js');
          const res = await mod.default(new Request('https://staging.invalid/.netlify/functions/academy?__route=api/identity/me'));
          if (res.status !== 503) throw Error('Unconfigured staging must deny all database actions, got ' + res.status);
          console.log('STAGING_GATEWAY_IMPORT_PASS; DATABASE_UNCONFIGURED_BLOCK_PASS');
          "
      - name: Verify that 19 routes, all source assets and 17 migrations remain
        run: npm run test:staging:static
      - name: Apply all 17 source SQL migrations and exercise disposable account/admission/deletion
        run: npm run test:staging:database
      - name: Test real Academy API login, accounts, gallery and Hifz against ephemeral DB
        run: npm run test:staging:api
      - name: Exercise admission review, account recovery, PDF, student notes and media against disposable database
        run: npm run test:staging:acceptance
