name: Check and package Academy source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          set -e
          find api pages lib public/assets -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Create source backup ZIP
        run: |
          zip -q -r shamsul-ulama-academy-source.zip public api lib pages migrations hatchable.toml README.md docs
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: shamsul-ulama-academy-source
          path: shamsul-ulama-academy-source.zip
          if-no-files-found: error
          retention-days: 30
