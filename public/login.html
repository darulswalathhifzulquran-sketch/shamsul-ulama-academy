<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="/assets/academy-owner-official-logo.png"><title>Academy Sign In</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#FFFFFF;color:#183B2A;min-height:100vh;display:grid;place-items:center}main{max-width:430px;width:90%;border:1px solid #dde7df;border-radius:16px;padding:30px}h1{font-family:Georgia,serif}label{display:block;margin:15px 0 8px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bdd1c2;border-radius:8px}button{margin-top:20px;background:#075333;color:#fff;padding:13px;border:none;border-radius:9px;width:100%;font-weight:bold}p{font-size:13px;line-height:1.6}#message{color:#a42424}</style></head><body><main><img src="/assets/academy-owner-official-logo.png" alt="Shamsul Ulama Islamic Academy official logo" width="100" height="104" style="width:86px;height:90px;object-fit:contain;display:block;margin:0 auto 16px"><h1>Shamsul Ulama Islamic Academy</h1><h2>Secure Sign In</h2><p>Enter the username and password supplied by your Usthad.</p><form id="login"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign In</button></form><p id="message" role="status"></p><a href="/">Back to Home</a></main><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const username=document.querySelector('#username').value,password=document.querySelector('#password').value;const message=document.querySelector('#message');try{const r=await fetch('/api/identity/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const data=await r.json();if(!r.ok)throw Error(data.error||'Login failed');const requested=new URLSearchParams(location.search).get('next');const safeNext=['/dashboard','/journey'].includes(requested)?requested:null;const roleHome=data.role==='admin'||data.role==='usthad'?'/staff':'/dashboard';const target=(safeNext||roleHome);location.replace(data.must_change_password?'/change-password?next='+encodeURIComponent(target):target);}catch(err){message.textContent=err.message;}});</script></body></html>
