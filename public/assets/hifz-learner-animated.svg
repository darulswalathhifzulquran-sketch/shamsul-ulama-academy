<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" role="img" aria-labelledby="t d">
<title id="t">Animated Hifz learner</title><desc id="d">An original illustrated smiling learner in a prayer cap gently raises his arms and nods confidently.</desc>
<style>
.l-arm{transform-box:fill-box;transform-origin:90% 10%;animation:la 3.8s ease-in-out infinite}
.r-arm{transform-box:fill-box;transform-origin:10% 10%;animation:ra 3.8s ease-in-out infinite}
.head{transform-box:fill-box;transform-origin:center bottom;animation:head 3.8s ease-in-out infinite}
.smile{transform-box:fill-box;transform-origin:center center;animation:smile 3.8s ease-in-out infinite}
.lid{animation:blink 4.7s linear infinite}
@keyframes la{0%,15%,100%{transform:rotate(18deg)}35%,65%{transform:rotate(-26deg)}85%{transform:rotate(13deg)}}
@keyframes ra{0%,15%,100%{transform:rotate(-18deg)}35%,65%{transform:rotate(26deg)}85%{transform:rotate(-13deg)}}
@keyframes head{0%,100%{transform:rotate(-3deg) translateY(0)}40%{transform:rotate(4deg) translateY(-4px)}65%{transform:rotate(-2deg)}}
@keyframes smile{0%,100%{transform:scaleY(.77)}40%,65%{transform:scaleY(1.3)}}
@keyframes blink{0%,43%,45%,100%{opacity:0}44%{opacity:1}}
@media(prefers-reduced-motion:reduce){.l-arm,.r-arm,.head,.smile,.lid{animation:none!important}}
</style>
<ellipse cx="150" cy="355" rx="90" ry="12" fill="#c9dacc" opacity=".6"/>
