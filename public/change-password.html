<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Change Password | Academy</title><style>*{box-sizing:border-box}body{font-family:system-ui;background:white;color:#153c2a;display:grid;place-items:center;min-height:100vh;margin:0}main{border:1px solid #dce8df;border-radius:14px;padding:30px;width:min(420px,90%)}label{display:block;margin:15px 0;font-weight:600;font-size:13px}input{display:block;width:100%;box-sizing:border-box;border:1px solid #c3d4c7;padding:12px;border-radius:8px;margin-top:8px}button{width:100%;background:#075333;color:white;padding:12px;border:0;border-radius:8px}p{font-size:13px}</style></head><body><main><img src="/assets/academy-official-logo.svg" alt="Shamsul Ulama Islamic Academy official logo" width="100" height="104" style="width:86px;height:90px;object-fit:contain;display:block;margin:0 auto 16px"><h1>Change Password</h1><p>For security, choose a new password of at least 12 characters, with letters and numbers.</p><form id="form"><label>Current Password<input type="password" id="current" required autocomplete="current-password"></label><label>New Password<input type="password" id="newpass" minlength="12" required autocomplete="new-password"></label><label>Confirm Password<input type="password" id="confirm" minlength="12" required autocomplete="new-password"></label><button type="submit">Save Password</button></form><p id="message" role="status"></p></main><script>let csrf='',role='student';fetch('/api/identity/me',{credentials:'include'}).then(async r=>{if(!r.ok){location.replace('/login');return;}const d=await r.json();csrf=d.csrf;role=d.account.role;});document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const p=document.querySelector('#newpass').value;if(p!==document.querySelector('#confirm').value){document.querySelector('#message').textContent='Passwords do not match.';return;}try{const r=await fetch('/api/identity/change-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Academy-CSRF':csrf},body:JSON.stringify({current_password:document.querySelector('#current').value,new_password:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not change password.');const requested=new URLSearchParams(location.search).get('next');const safeNext=['/dashboard','/journey'].includes(requested)?requested:null;location.replace(safeNext||(role==='admin'||role==='usthad'?'/staff':'/dashboard'));}catch(e){document.querySelector('#message').textContent=e.message;}});</script></body></html>
