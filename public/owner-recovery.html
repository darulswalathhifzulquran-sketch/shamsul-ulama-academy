<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner Account Recovery · Academy</title><link rel="icon" type="image/svg+xml" href="/assets/academy-official-logo.svg"><style>*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#f5f8f4;color:#1d4532;min-height:100vh;display:grid;place-items:center;margin:0;padding:22px}main{width:min(470px,100%);background:#fff;border:1px solid #dce7dc;border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 14px 42px #21442b13}img{display:block;margin:0 auto 12px}h1{font-family:Georgia,serif;font-size:29px;line-height:1.2}p{font-size:13px;line-height:1.7;color:#536d59}label{display:block;margin:14px 0 4px;font-weight:700;font-size:13px}input{width:100%;padding:13px;border:1px solid #b5cbb9;border-radius:9px;font:inherit}button{width:100%;background:#145b3b;color:#fff;padding:13px;border:0;border-radius:9px;margin-top:20px;font-weight:750;cursor:pointer}button:disabled{opacity:.5}#message{font-weight:650}a{color:#17623e}</style></head><body><main><img src="/assets/academy-official-logo.svg" width="90" height="95" alt="Shamsul Ulama Islamic Academy logo"><h1>Academy Owner Recovery</h1><p>This form is for the <strong>Hatchable project owner or admin only.</strong> It will replace the Academy Administrator password, revoke previous sessions and preserve all student records. Do not enter a password that you have shared in a chat.</p><form id="recovery"><label for="username">Administrator Username</label><input id="username" name="username" value="administration" autocomplete="username" required minlength="4"><label for="password">Choose a NEW private password</label><input id="password" type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">Confirm Password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button id="submit" type="submit">Change Administrator Password</button></form><p id="message" role="status" aria-live="polite"></p><p><a href="/login">Return to Academy Sign In</a></p></main><script>document.querySelector('#recovery').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,btn=document.querySelector('#submit'),msg=document.querySelector('#message'),password=document.querySelector('#password').value;if(password!==document.querySelector('#confirm').value){msg.textContent='Passwords do not match.';return;}btn.disabled=true;msg.textContent='Verifying project-owner access…';try{const r=await fetch('/api/identity/owner-recovery',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,new_password:password})});const data=await r.json();if(!r.ok)throw Error(data.error||data.message||'Only a Hatchable project administrator can perform this recovery.');msg.textContent='Password changed. Old sessions have been revoked. Open Academy Sign In to continue.';form.reset();form.hidden=true;}catch(err){msg.textContent=err.message;}finally{btn.disabled=false;}});</script></body></html>
