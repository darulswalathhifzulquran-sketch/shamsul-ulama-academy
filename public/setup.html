<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Owner Setup | Shamsul Ulama Academy</title><style>body{font-family:system-ui;background:#FFFFFF;color:#183B2A;min-height:100vh;display:grid;place-items:center;margin:0}main{border:1px solid #d9e9da;border-radius:14px;padding:32px;max-width:450px;width:90%;box-sizing:border-box}h1{font-family:Georgia,serif}label{display:block;font-weight:bold;font-size:13px;margin:15px 0 5px}input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #a5bbaa;border-radius:8px}button{background:#075333;color:#fff;border:none;border-radius:8px;padding:13px;margin-top:18px;width:100%}p{font-size:13px;line-height:1.6}</style></head><body><main><img src="/assets/academy-official-logo.svg" alt="Shamsul Ulama Islamic Academy official logo" width="100" height="104" style="width:86px;height:90px;object-fit:contain;display:block;margin:0 auto 16px"><h1>Academy Owner Setup</h1><p id="status">Checking secure project-owner access…</p><form id="form" hidden><label>Staging Setup Key<input id="setupToken" type="password" autocomplete="off" required placeholder="Private key configured in Netlify environment"></label><label>Administrator Name<input id="name" required></label><label>Username<input id="username" value="usthad" autocomplete="username" autocapitalize="none" required minlength="4" maxlength="32"></label><label>Strong Password<input id="password" type="password" required minlength="12" autocomplete="new-password"></label><label>Confirm Password<input id="confirm" type="password" required minlength="12"></label><button type="submit">Create Administrator</button></form><p><a href="/">Academy Home</a></p></main><script>const msg=document.querySelector('#status');fetch('/api/identity/bootstrap',{credentials:'include'}).then(async r=>{if(!r.ok)throw Error('Only the project owner may activate this administrator account.');const d=await r.json();if(d.setupRequired){document.querySelector('#form').hidden=false;msg.textContent='Set your own administrator username and password.';}else msg.textContent='Administrator account already configured. Please sign in.';}).catch(e=>msg.textContent=e.message);document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const password=document.querySelector('#password').value;if(password!==document.querySelector('#confirm').value){msg.textContent='Passwords do not match.';return;}try{const r=await fetch('/api/identity/bootstrap',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','x-academy-setup-token':document.querySelector('#setupToken').value},body:JSON.stringify({display_name:document.querySelector('#name').value,username:document.querySelector('#username').value,password})});const d=await r.json();if(!r.ok)throw Error(d.error||'Setup failed');msg.textContent='Administrator created. Continue to the Academy Sign In.';document.querySelector('#form').hidden=true;location.href='/login';}catch(e){msg.textContent=e.message;}});</script></body></html>
